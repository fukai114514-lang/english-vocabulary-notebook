name: Validate reference content
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, preservation, routes, dictionary, UI and contrast regression gate
        run: python3 scripts/audit_baseline.py --output /tmp/wordbook-validation.json
      - name: Keep validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.sha }}
          path: /tmp/wordbook-validation.json
      - run: git diff --exit-code -- dist
