name: Validate reference content
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, preservation, routes, dictionary, UI and contrast regression gate
        run: python3 scripts/audit_baseline.py --output /tmp/wordbook-validation.json
      - name: Keep validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.sha }}
          path: /tmp/wordbook-validation.json
      - run: git diff --exit-code -- dist
  design-browser:
    if: startsWith(github.ref, 'refs/heads/design/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.58.0 Pillow==12.1.0
          python -m playwright install --with-deps chromium webkit
      - name: Check search, speech, recording, history and safe areas
        run: python scripts/test_integration_browser.py
      - name: Check typography, grid alignment and hit targets
        run: |
          python scripts/measure_homepage.py dist /tmp/layout/chromium --verify --metrics-only
          python scripts/measure_homepage.py dist /tmp/layout/webkit --engine webkit --verify --metrics-only
      - uses: actions/upload-artifact@v4
        with:
          name: design-layout-${{ github.sha }}
          path: /tmp/layout
